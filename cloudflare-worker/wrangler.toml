name = "vayusarathi-api"
main = "src/index.js"
compatibility_date = "2026-11-23"
workers_dev = true

# Create this KV namespace in Cloudflare and replace the placeholder ID.
[[kv_namespaces]]
binding = "VERIFICATION_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["0 * * * *"]

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
OPENAI_MODEL = "gpt-6-luna"
